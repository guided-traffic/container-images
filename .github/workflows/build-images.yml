name: Build Container Images

on:
  push:
    branches: [ main ]  # Only run on main branch
    paths:
      - '*/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '*/**'
  schedule:
    # Run every Sunday at 20:00 UTC (8 PM) to rebuild all images
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        type: boolean
        default: false
      specific_image:
        description: 'Build specific image (directory name)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  REGISTRY_USER: guidedtraffic

permissions:
  contents: read
  packages: write
  id-token: write  # Required for SLSA provenance
  attestations: write  # Required for attestations
  security-events: write  # Required for SARIF upload

jobs:
  discover-images:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover image directories
        id: set-matrix
        run: |
          echo "Discovering directories with Containerfile and image.yml..."

          # Build matrix as array of objects with: image-dir, version (optional), is-additional (optional)
          matrix_entries=()

          # Find all directories containing both Containerfile and image.yml
          for dir in */; do
            if [[ -f "${dir}Containerfile" && -f "${dir}image.yml" ]]; then
              # Remove trailing slash
              dir_name=${dir%/}

              # Check if specific image is requested
              if [[ -n "${{ github.event.inputs.specific_image }}" ]]; then
                if [[ "$dir_name" != "${{ github.event.inputs.specific_image }}" ]]; then
                  continue
                fi
              else
                # Check if files changed in this directory (for non-force builds)
                # Always rebuild for scheduled runs (weekly rebuild), force rebuild, workflow dispatch,
                # or when the workflow file itself changed (build process may have changed)
                if [[ "${{ github.event.inputs.force_rebuild }}" != "true" ]] && \
                   [[ "${{ github.event_name }}" != "schedule" ]] && \
                   [[ "${{ github.event_name }}" != "workflow_dispatch" ]] && \
                   ! git diff --name-only HEAD~1 HEAD | grep -q "^\.github/workflows/" && \
                   ! git diff --name-only HEAD~1 HEAD | grep -q "^${dir}"; then
                  continue
                fi
              fi

              # Extract image name from image.yml for display
              if command -v yq >/dev/null 2>&1; then
                image_name=$(yq e '.name' "${dir}image.yml")
              else
                image_name=$(grep '^name:' "${dir}image.yml" | cut -d' ' -f2- | sed 's/#.*//' | tr -d '" ' | sed 's/[[:space:]]*$//')
              fi

              # Add main image build (from image.yml)
              matrix_entries+=("{\"image-dir\":\"$dir_name\",\"image-name\":\"$image_name\"}")

              # Check for additional_versions.yml to build older versions
              if [[ -f "${dir}additional_versions.yml" ]]; then
                echo "Found additional_versions.yml in $dir_name, parsing versions..."

                # Parse additional versions using yq or grep
                if command -v yq >/dev/null 2>&1; then
                  # Use yq to parse versions array directly
                  num_versions=$(yq e '.versions | length' "${dir}additional_versions.yml")
                  for ((i=0; i<num_versions; i++)); do
                    version=$(yq e ".versions[$i].version" "${dir}additional_versions.yml")
                    if [[ -n "$version" ]]; then
                      echo "  Adding additional version: $version"
                      matrix_entries+=("{\"image-dir\":\"$dir_name\",\"image-name\":\"$image_name\",\"version\":\"$version\",\"is-additional\":\"true\"}")
                    fi
                  done
                else
                  # Fallback: simple grep parsing to extract version
                  while IFS= read -r line; do
                    if [[ "$line" =~ version:[[:space:]]*\"?([0-9.]+)\"? ]]; then
                      version="${BASH_REMATCH[1]}"
                      if [[ -n "$version" ]]; then
                        echo "  Adding additional version: $version"
                        matrix_entries+=("{\"image-dir\":\"$dir_name\",\"image-name\":\"$image_name\",\"version\":\"$version\",\"is-additional\":\"true\"}")
                      fi
                    fi
                  done < "${dir}additional_versions.yml"
                fi
              fi
            fi
          done

          # Convert to JSON array
          if [ ${#matrix_entries[@]} -eq 0 ]; then
            matrix="[]"
          else
            # Build JSON array from matrix entries
            if command -v jq >/dev/null 2>&1; then
              # Use jq for robust JSON array construction
              matrix=$(printf '%s\n' "${matrix_entries[@]}" | jq -s -c .)
            else
              # Fallback to manual construction
              matrix="["
              first=true
              for entry in "${matrix_entries[@]}"; do
                if [ "$first" = true ]; then
                  first=false
                else
                  matrix+=","
                fi
                matrix+="$entry"
              done
              matrix+="]"
            fi
          fi

          echo "Matrix entries: ${#matrix_entries[@]}"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-images:
    needs: discover-images
    if: needs.discover-images.outputs.matrix != '[]'
    runs-on: self-hosted
    name: ${{ matrix.image-name }}${{ matrix.version && format(' ({0})', matrix.version) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.discover-images.outputs.matrix)}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse image configuration
        id: config
        run: |
          cd "${{ matrix.image-dir }}"

          # Parse YAML file using yq or basic parsing
          if command -v yq >/dev/null 2>&1; then
            NAME=$(yq e '.name' image.yml)
            VERSION=$(yq e '.version' image.yml)
            DESCRIPTION=$(yq e '.description' image.yml)
            REGISTRY=$(yq e '.registry' image.yml)
            PLATFORMS=$(yq e '.platforms | join(",")' image.yml)
            # Parse categories as comma-separated string for Docker Hub
            CATEGORIES=$(yq e '.category | join(",")' image.yml)
            # Parse optional component versions (kubectl, yq, etc.)
            KUBECTL_VERSION=$(yq e '.kubectl_version // ""' image.yml)
            YQ_VERSION=$(yq e '.yq_version // ""' image.yml)
          else
            # Fallback parsing without yq - strip inline comments (anything after #)
            NAME=$(grep '^name:' image.yml | cut -d' ' -f2- | sed 's/#.*//' | tr -d '" ' | sed 's/[[:space:]]*$//')
            VERSION=$(grep '^version:' image.yml | cut -d' ' -f2- | sed 's/#.*//' | tr -d '" ' | sed 's/[[:space:]]*$//')
            DESCRIPTION=$(grep '^description:' image.yml | cut -d' ' -f2- | sed 's/#.*//' | tr -d '"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            REGISTRY=$(grep '^registry:' image.yml | cut -d' ' -f2- | sed 's/#.*//' | tr -d '" ' | sed 's/[[:space:]]*$//')
            PLATFORMS="linux/amd64,linux/arm64"
            # Parse categories (simple extraction from YAML array)
            CATEGORIES=$(grep -A 10 '^category:' image.yml | grep '  -' | sed 's/  - //' | tr '\n' ',' | sed 's/,$//')
            # Parse optional component versions
            KUBECTL_VERSION=$(grep '^kubectl_version:' image.yml | cut -d' ' -f2- | sed 's/#.*//' | tr -d '" ' | sed 's/[[:space:]]*$//' || echo "")
            YQ_VERSION=$(grep '^yq_version:' image.yml | cut -d' ' -f2- | sed 's/#.*//' | tr -d '" ' | sed 's/[[:space:]]*$//' || echo "")
          fi

          # Override version if this is an additional version build
          if [[ -n "${{ matrix.version }}" ]]; then
            echo "Building additional version: ${{ matrix.version }}"
            VERSION="${{ matrix.version }}"
          fi

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "categories=$CATEGORIES" >> $GITHUB_OUTPUT
          echo "full-name=$REGISTRY/$NAME" >> $GITHUB_OUTPUT

          # Generate build args dynamically from all version fields in image.yml
          # This allows each image to define its own version parameters
          BUILD_ARGS="IMAGE_VERSION=${VERSION}"

          # Parse all *_version fields from image.yml and add them as build args
          if command -v yq >/dev/null 2>&1; then
            # Use yq to extract all keys ending with _version
            while IFS= read -r key; do
              value=$(yq e ".${key}" image.yml)
              # Convert key to uppercase for build arg (e.g., yq_version -> YQ_VERSION)
              arg_name=$(echo "$key" | tr '[:lower:]' '[:upper:]')
              BUILD_ARGS="${BUILD_ARGS}"$'\n'"${arg_name}=${value}"
            done < <(yq e 'keys | .[] | select(. == "*_version")' image.yml 2>/dev/null || true)
          else
            # Fallback: parse all lines ending with _version:
            while IFS=: read -r key value; do
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs | sed 's/#.*//' | tr -d '"')
              if [[ "$key" == *"_version" ]]; then
                arg_name=$(echo "$key" | tr '[:lower:]' '[:upper:]')
                BUILD_ARGS="${BUILD_ARGS}"$'\n'"${arg_name}=${value}"
              fi
            done < image.yml
          fi

          # Also add the main version as {IMAGENAME}_VERSION for compatibility
          # e.g., ETCD_VERSION, KUBECTL_VERSION, etc.
          IMAGE_NAME_UPPER=$(echo "$NAME" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          BUILD_ARGS="${BUILD_ARGS}"$'\n'"${IMAGE_NAME_UPPER}_VERSION=${VERSION}"

          # Store build args (escape newlines for GitHub Actions)
          {
            echo "build-args<<EOF"
            echo "$BUILD_ARGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          # Use native snapshotter to avoid overlay-on-overlay mount failures
          # on self-hosted runners where Docker already uses overlay2
          buildkitd-flags: --oci-worker-snapshotter=native

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Calculate version tags
        id: version-tags
        run: |
          VERSION="${{ steps.config.outputs.version }}"
          FULL_NAME="${{ steps.config.outputs.full-name }}"
          IS_ADDITIONAL="${{ matrix.is-additional }}"

          # Extract major version (e.g., 1.31.3 -> 1)
          MAJOR_VERSION=$(echo "$VERSION" | grep -oE '^[0-9]+')

          # Extract minor version (e.g., 1.31.3 -> 1.31)
          MINOR_VERSION=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+')

          # Generate timestamp (YYYYMMDDHHMMSS)
          TIMESTAMP=$(date -u '+%Y%m%d%H%M%S')

          # Build tags list
          TAGS="${FULL_NAME}:${VERSION}"
          TAGS="${TAGS}"$'\n'"${FULL_NAME}:${MAJOR_VERSION}"
          TAGS="${TAGS}"$'\n'"${FULL_NAME}:${MINOR_VERSION}"
          TAGS="${TAGS}"$'\n'"${FULL_NAME}:${VERSION}-${TIMESTAMP}"

          # Add latest tag only for main branch and non-additional versions
          if [[ "${{ github.ref_name }}" == "main" && "$IS_ADDITIONAL" != "true" ]]; then
            TAGS="${TAGS}"$'\n'"${FULL_NAME}:latest"
          fi

          # Add branch tag for non-main branches (only for primary image)
          if [[ "${{ github.ref_name }}" != "main" && "$IS_ADDITIONAL" != "true" && "${{ github.event_name }}" == "push" ]]; then
            TAGS="${TAGS}"$'\n'"${FULL_NAME}:${{ github.ref_name }}"
          fi

          # Add PR tag
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAGS="${TAGS}"$'\n'"${FULL_NAME}:pr-${{ github.event.pull_request.number }}"
          fi

          # Output for docker build (newline-separated list)
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Generated tags:"
          echo "$TAGS"

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image-dir }}
          file: ${{ matrix.image-dir }}/Containerfile
          platforms: ${{ steps.config.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.version-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.config.outputs.name }}
            org.opencontainers.image.description=${{ steps.config.outputs.description }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ steps.config.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=${{ steps.config.outputs.description }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: 'v3.1.2'

      - name: Install Syft for SBOM generation
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        id: sbom
        env:
          # Ensure Docker credentials are available for private repositories
          DOCKER_CONFIG: /home/runner/.docker
        run: |
          # Extract image digest from build output
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_NAME="${{ steps.config.outputs.full-name }}"

          echo "Generating SBOM for ${IMAGE_NAME}@${IMAGE_DIGEST}"

          # Verify we can access the image before generating SBOM
          echo "Verifying image access for SBOM generation..."
          docker manifest inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" > /dev/null || {
            echo "❌ Cannot access image for SBOM generation"
            exit 1
          }

          # Generate SBOM in multiple formats
          echo "Generating SPDX SBOM..."
          syft "${IMAGE_NAME}@${IMAGE_DIGEST}" -o spdx-json=sbom-${{ matrix.image-dir }}.spdx.json

          echo "Generating CycloneDX SBOM..."
          syft "${IMAGE_NAME}@${IMAGE_DIGEST}" -o cyclonedx-json=sbom-${{ matrix.image-dir }}.cyclonedx.json

          echo "Generating Syft native SBOM..."
          syft "${IMAGE_NAME}@${IMAGE_DIGEST}" -o syft-json=sbom-${{ matrix.image-dir }}.syft.json

          echo "sbom-path-spdx=sbom-${{ matrix.image-dir }}.spdx.json" >> $GITHUB_OUTPUT
          echo "sbom-path-cyclonedx=sbom-${{ matrix.image-dir }}.cyclonedx.json" >> $GITHUB_OUTPUT

          echo "✅ SBOM generation completed successfully"

      - name: Sign container image with Cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: 1
          # Ensure Docker credentials are available for private repositories
          DOCKER_CONFIG: /home/runner/.docker
        run: |
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_NAME="${{ steps.config.outputs.full-name }}"

          echo "Signing ${IMAGE_NAME}@${IMAGE_DIGEST}"

          # Verify we can access the image (important for private repos)
          echo "Verifying image access..."
          docker manifest inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" > /dev/null || {
            echo "❌ Cannot access image ${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo "This may indicate the image is private and credentials are not properly configured"
            exit 1
          }

          # Sign the container image
          echo "Signing container image..."
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

          # Sign the SBOM
          echo "Signing SBOM attestation..."
          cosign attest --yes --predicate sbom-${{ matrix.image-dir }}.spdx.json "${IMAGE_NAME}@${IMAGE_DIGEST}"

          echo "✅ Successfully signed image and SBOM"

      - name: Generate SLSA Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.config.outputs.full-name }}
          subject-digest: ${{ steps.build.outputs.digest }}

