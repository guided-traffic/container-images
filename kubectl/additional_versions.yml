# Additional kubectl versions to build alongside the main version from image.yml
#
# The main image.yml contains the NEWEST kubectl version (currently 1.34.x) which is
# automatically updated by Renovate.
#
# This file lists OLDER versions that should also be built to support multiple
# Kubernetes minor versions (as per Kubernetes version skew policy).
#
# Tags generated:
#   - From image.yml: kubectl:1.34.0, kubectl:1.34, kubectl:latest
#   - From this file:  kubectl:1.33.2, kubectl:1.33 (NO latest tag)
#                     kubectl:1.32.2, kubectl:1.32 (NO latest tag)
#
# IMPORTANT: Additional versions from this file will NOT update the 'latest' tag!
# Only the main version in image.yml gets the 'latest' tag.
#
# Maintenance:
# - Patch versions: Renovate updates automatically
# - Minor version shift: Manual update required when new K8s version releases (~4x/year)
#   Example: When K8s 1.35 is released:
#     1. Update image.yml to version: 1.35.x (Renovate will do this)
#     2. Update this file to remove old version and add previous version

versions:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes versioning=loose extractVersion=^v?(?<version>.*)$
  - minor: "1.33"
    patch: "2"      # Renovate updates automatically
  # renovate: datasource=github-releases depName=kubernetes/kubernetes versioning=loose extractVersion=^v?(?<version>.*)$
  - minor: "1.32"
    patch: "2"      # Renovate updates automatically
