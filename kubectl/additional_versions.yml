# Additional kubectl versions to build alongside the main version from image.yml
#
# The main image.yml contains the NEWEST kubectl version (currently 1.36.x) which is
# automatically updated by Renovate.
#
# This file lists OLDER versions that should also be built to support multiple
# Kubernetes minor versions (as per Kubernetes version skew policy).
#
# Each version entry is automatically updated by Renovate to the latest patch release.
#
# Tags generated:
#   - From image.yml: kubectl:1.36.3, kubectl:1.36, kubectl:latest
#   - From this file: kubectl:1.35.7, kubectl:1.35 (NO latest tag)
#                     kubectl:1.34.10, kubectl:1.34 (NO latest tag)
#
# IMPORTANT: when bumping to a new minor, also rename the `depName=kubectl-<minor>`
# comment below AND the matching allowedVersions rule in renovate.json. Otherwise
# Renovate silently stops updating that entry.

versions:
  # renovate: datasource=github-releases depName=kubectl-1.35 packageName=kubernetes/kubernetes versioning=semver
  - version: "1.35.8"
  # renovate: datasource=github-releases depName=kubectl-1.34 packageName=kubernetes/kubernetes versioning=semver
  - version: "1.34.11"
